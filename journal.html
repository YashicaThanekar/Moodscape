<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

     <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><a href="index.html">MOODSCAPE</a></div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="explore.html" class="nav-link">Explore</a></li>
                <li><a href="favorites.html" class="nav-link">Favorites</a></li>
                <li><a href="journal.html" class="nav-link">Journal</a></li>
            </ul>
            <div class="profile-icon"></div>
        </div>
    </nav>
</body>
<section class="journal-section" style="margin-top: 6rem; max-width: 900px; margin-left: auto; margin-right: auto;">
    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; color: #fff;">Rate your day</h2>
    <div class="star-rating" style="font-size: 2.5rem; margin-bottom: 2.5rem;">
        <span class="star" data-value="1" style="color: #ffeb3b; cursor: pointer;">&#9733;</span>
        <span class="star" data-value="2" style="color: #ffeb3b; cursor: pointer;">&#9733;</span>
        <span class="star" data-value="3" style="color: #ffeb3b; cursor: pointer;">&#9733;</span>
        <span class="star" data-value="4" style="color: #666a00; cursor: pointer;">&#9733;</span>
        <span class="star" data-value="5" style="color: #666a00; cursor: pointer;">&#9733;</span>
    </div>
    <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; color: #fff;">How was your day?</h2>
    <textarea class="journal-textarea" rows="6" style="width: 100%; border-radius: 8px; border: 2px solid #00bcd4; background: #000; color: #fff; font-size: 1.1rem; padding: 1rem; margin-bottom: 2rem;"></textarea>
</section>
<script>
// Interactive star rating for journal page
document.querySelectorAll('.star-rating .star').forEach(function(star, idx, arr) {
    star.addEventListener('mouseenter', function() {
        arr.forEach((s, i) => {
            s.style.color = i <= idx ? '#ffeb3b' : '#666a00';
        });
    });
    star.addEventListener('mouseleave', function() {
        arr.forEach((s, i) => {
            s.style.color = s.classList.contains('selected') ? '#ffeb3b' : '#666a00';
        });
    });
    star.addEventListener('click', function() {
        arr.forEach((s, i) => {
            if (i <= idx) {
                s.classList.add('selected');
                s.style.color = '#ffeb3b';
            } else {
                s.classList.remove('selected');
                s.style.color = '#666a00';
            }
        });
    });
});
</script>
</body>
</html>
